<!DOCTYPE html>
<html lang="en" data-theme="light" data-hero-style="photo" data-show-remember="false" data-show-forgot="false" data-show-foot="false">
<head>
  <meta charset="UTF-8" />
  <title>Login · ZephryxLabs CRM</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    /* ─────────────────────────  tokens  ───────────────────────── */
    :root {
      --green:        #15A848;
      --green-2:      #119A40;
      --green-deep:   #0A6B2C;
      --green-soft:   #E6F4EB;
      --green-softer: #EEF6F1;
      --field-bg:     #DFF1E5;
      --field-bg-2:   #D2EBDB;
      --surface:      #FFFFFF;
      --ink:          #0F1714;
      --ink-2:        #1A2620;
      --muted:        #5C6B65;
      --line:         #E4EBE6;
      --line-strong:  #D5DED8;
      --yellow:       #F5C518;
      --shadow-btn:   0 18px 32px -12px rgba(14, 122, 54, 0.55);
      --radius-pill:  999px;
      --radius-btn:   14px;
    }
    [data-theme="dark"] {
      --green:        #25C95A;
      --green-2:      #1FB04E;
      --green-deep:   #0A6B2C;
      --green-soft:   #16321F;
      --green-softer: #0F2017;
      --field-bg:     #142A1D;
      --field-bg-2:   #183626;
      --surface:      #0E1310;
      --ink:          #ECEFEC;
      --ink-2:        #C7CDCA;
      --muted:        #8A938E;
      --line:         #1E2823;
      --line-strong:  #2A352F;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background: var(--surface);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
      min-height: 100vh;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    /* ─────────────────────────  layout  ───────────────────────── */
    .auth {
      display: grid;
      grid-template-columns: 1fr 1fr;
      min-height: 100vh;
    }

    /* ─────────────  visual / green panel  ───────────── */
    .visual-panel {
      position: relative;
      background:
        radial-gradient(120% 90% at 10% 0%,  #1AB85A 0%, #15A848 40%, #119A40 75%, #0E8A39 100%);
      overflow: hidden;
      display: grid;
      place-items: center;
      padding: 64px 56px;
    }

    /* decorative waves */
    .visual-panel .waves {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .visual-panel .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(50px);
      pointer-events: none;
    }
    .visual-panel .orb-1 {
      width: 460px; height: 460px;
      background: #3BE07A;
      top: -140px; right: -120px;
      opacity: 0.55;
    }
    .visual-panel .orb-2 {
      width: 360px; height: 360px;
      background: #07591F;
      bottom: -140px; left: -90px;
      opacity: 0.7;
    }
    .visual-panel .orb-3 {
      width: 320px; height: 320px;
      background: #2DD56F;
      top: 40%; left: 22%;
      opacity: 0.35;
    }

    /* composition wrapper — card + person + badge all share this coord space */
    .composition {
      position: relative;
      width: min(440px, 100%);
      aspect-ratio: 4 / 5;
      max-height: calc(100vh - 128px);
    }

    /* glass card — flat white tint, low opacity, heavy blur so the green texture reads through */
    .glass-card {
      position: absolute;
      inset: 0;
      border-radius: 40px;
      background: rgba(255, 255, 255, 0.10);
      backdrop-filter: blur(36px) saturate(160%);
      -webkit-backdrop-filter: blur(36px) saturate(160%);
      border: 1px solid rgba(255, 255, 255, 0.32);
      box-shadow: 0 28px 60px -24px rgba(0, 0, 0, 0.35),
                  inset 0 1px 0 rgba(255, 255, 255, 0.45);
      overflow: hidden;
    }

    .manifesto {
      position: absolute;
      top: 12%;
      left: 9%;
      right: 38%;
      z-index: 2;
      pointer-events: none;
    }
    .manifesto span {
      display: block;
      font-size: clamp(28px, 2.85vw, 44px);
      line-height: 1.05;
      font-weight: 800;
      color: #FFFFFF;
      letter-spacing: -0.038em;
      text-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }

    /* hero photo — SIBLING of glass-card, can extend below card */
    .hero-photo {
      position: absolute;
      top: 8%;
      right: -2%;
      width: 62%;
      bottom: -10%;     /* extends past card bottom */
      display: flex;
      align-items: flex-end;
      justify-content: flex-end;
      pointer-events: none;
      z-index: 3;
    }
    .photo-svg {
      width: 100%;
      height: 100%;
      display: block;
    }
    /* style swap */
    [data-hero-style="photo"]        .photo-svg-illust,
    [data-hero-style="photo"]        .photo-svg-abstract,
    [data-hero-style="illustration"] .photo-svg-photo,
    [data-hero-style="illustration"] .photo-svg-abstract,
    [data-hero-style="abstract"]     .photo-svg-photo,
    [data-hero-style="abstract"]     .photo-svg-illust {
      display: none;
    }
    /* abstract: contained inside the card, not bleeding out */
    [data-hero-style="abstract"] .hero-photo {
      inset: 8% 6% 8% 40%;
      width: auto;
    }

    /* lightning bolt badge — bottom-left of composition */
    .lightning-badge {
      position: absolute;
      left: -5%;
      bottom: 14%;
      width: 92px;
      height: 92px;
      border-radius: 50%;
      background: #FFFFFF;
      display: grid;
      place-items: center;
      box-shadow: 0 18px 36px -12px rgba(0,0,0,0.30),
                  0 4px 10px -2px rgba(0,0,0,0.12);
      z-index: 4;
    }
    .lightning-badge svg { width: 42px; height: 42px; color: var(--yellow); }

    /* ─────────────  form panel  ───────────── */
    .form-panel {
      background: var(--surface);
      display: grid;
      place-items: center;
      padding: 56px 64px;
      position: relative;
    }
    .login-form {
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    .form-brand {
      display: flex;
      justify-content: center;
    }
    .z-mark {
      width: 72px;
      height: 72px;
      color: var(--ink);
    }

    .welcome {
      text-align: center;
      font-size: 22px;
      font-weight: 500;
      color: var(--ink-2);
      margin: -6px 0 18px;
      letter-spacing: -0.005em;
    }

    /* fields — pill, soft mint */
    .field {
      display: flex;
      align-items: center;
      gap: 16px;
      background: var(--field-bg);
      border-radius: var(--radius-pill);
      padding: 0 30px;
      height: 70px;
      border: 1.5px solid transparent;
      transition: border-color 0.18s ease, background-color 0.18s ease, box-shadow 0.18s ease;
    }
    .field:hover { background: var(--field-bg-2); }
    .field:focus-within {
      border-color: var(--green);
      background: var(--surface);
      box-shadow: 0 0 0 4px color-mix(in oklab, var(--green) 16%, transparent);
    }
    .field-ic {
      color: var(--ink);
      flex-shrink: 0;
      display: grid;
      place-items: center;
    }
    .field-ic svg { width: 22px; height: 22px; }
    .field input {
      flex: 1;
      min-width: 0;
      border: 0;
      outline: 0;
      background: transparent;
      font: 500 16px/1 'Plus Jakarta Sans', sans-serif;
      color: var(--ink);
      letter-spacing: -0.005em;
    }
    .field input::placeholder {
      color: var(--ink-2);
      opacity: 0.6;
      font-weight: 500;
    }

    .eye-toggle {
      appearance: none;
      background: transparent;
      border: 0;
      color: var(--muted);
      cursor: pointer;
      padding: 6px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      transition: color 0.16s, background 0.16s;
    }
    .eye-toggle:hover { color: var(--ink); background: rgba(0,0,0,0.04); }
    [data-theme="dark"] .eye-toggle:hover { background: rgba(255,255,255,0.06); }
    .eye-toggle svg { width: 20px; height: 20px; }

    /* options row */
    .form-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-top: -4px;
    }
    .check {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      font-size: 13.5px;
      color: var(--ink-2);
      cursor: pointer;
      user-select: none;
    }
    .check input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }
    .check .box {
      width: 18px; height: 18px;
      border-radius: 5px;
      border: 1.5px solid var(--line-strong);
      background: var(--surface);
      display: grid;
      place-items: center;
      transition: background 0.16s, border-color 0.16s;
      flex-shrink: 0;
    }
    .check .box::after {
      content: "";
      width: 9px; height: 5px;
      border-left: 2px solid #fff;
      border-bottom: 2px solid #fff;
      transform: rotate(-45deg) translate(1px, -1px);
      opacity: 0;
      transition: opacity 0.14s;
    }
    .check input:checked + .box { background: var(--green); border-color: var(--green); }
    .check input:checked + .box::after { opacity: 1; }
    .check:hover .box { border-color: var(--green); }
    .forgot {
      font-size: 13.5px;
      font-weight: 600;
      color: var(--green);
      text-decoration: none;
    }
    .forgot:hover { color: var(--green-2); text-decoration: underline; }

    /* submit button — NARROWER than fields, centered */
    .btn-login {
      align-self: center;
      width: 240px;
      height: 60px;
      border: 0;
      border-radius: var(--radius-btn);
      background: linear-gradient(135deg, #18B651 0%, #0E7A36 100%);
      color: #fff;
      font: 700 16.5px/1 'Plus Jakarta Sans', sans-serif;
      letter-spacing: -0.005em;
      cursor: pointer;
      box-shadow: var(--shadow-btn);
      margin-top: 12px;
      transition: transform 0.16s, box-shadow 0.16s, filter 0.16s;
      overflow: hidden;
    }
    .btn-login:hover {
      transform: translateY(-1px);
      box-shadow: 0 22px 38px -12px rgba(14, 122, 54, 0.65);
    }
    .btn-login:active { transform: translateY(0); }
    .btn-login:disabled { cursor: wait; filter: saturate(0.7); }
    .btn-label {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-login.loading .btn-label::after {
      content: "";
      width: 16px; height: 16px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.35);
      border-top-color: #fff;
      animation: spin 0.7s linear infinite;
      margin-left: 4px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .btn-login.success {
      background: linear-gradient(135deg, #19A848 0%, #0F7A36 100%);
    }

    .form-foot {
      margin: 8px 0 0;
      text-align: center;
      font-size: 13.5px;
      color: var(--muted);
    }
    .form-foot a {
      color: var(--green);
      font-weight: 600;
      text-decoration: none;
    }
    .form-foot a:hover { text-decoration: underline; }

    /* tweak-controlled visibility */
    [data-show-remember="false"] .check,
    [data-show-forgot="false"]   .forgot,
    [data-show-foot="false"]     .form-foot { display: none; }
    [data-show-remember="false"][data-show-forgot="false"] .form-row { display: none; }
    [data-show-remember="false"][data-show-forgot="true"]  .form-row { justify-content: flex-end; }
    [data-show-remember="true"][data-show-forgot="false"]  .form-row { justify-content: flex-start; }

    /* ─────────────  responsive: tablet  ───────────── */
    @media (max-width: 1100px) {
      .visual-panel { padding: 48px 40px; }
      .form-panel   { padding: 48px 40px; }
      .composition { width: min(440px, 100%); }
      .lightning-badge { width: 76px; height: 76px; }
      .lightning-badge svg { width: 34px; height: 34px; }
    }

    /* ─────────────  responsive: mobile stacked  ───────────── */
    @media (max-width: 900px) {
      .auth {
        grid-template-columns: 1fr;
        grid-template-rows: auto auto;
      }
      .visual-panel {
        padding: 36px 20px 60px;
        min-height: 58vh;
      }
      .composition {
        width: min(380px, 92%);
        aspect-ratio: 4/5;
      }
      .lightning-badge {
        width: 72px;
        height: 72px;
        left: -3%;
        bottom: 10%;
      }
      .lightning-badge svg { width: 32px; height: 32px; }

      .form-panel {
        background: var(--surface);
        border-radius: 32px 32px 0 0;
        margin-top: -32px;
        padding: 48px 28px 40px;
        z-index: 5;
        box-shadow: 0 -24px 48px -24px rgba(15, 30, 22, 0.12);
      }
      .login-form { gap: 20px; max-width: 100%; }
      .z-mark { width: 56px; height: 56px; }
      .welcome { font-size: 19px; margin: -4px 0 14px; }
      .field { height: 62px; padding: 0 24px; gap: 14px; }
      .field-ic svg { width: 20px; height: 20px; }
      .field input { font-size: 15px; }
      .btn-login { width: 100%; max-width: 280px; height: 56px; }
    }

    @media (max-width: 480px) {
      .visual-panel { padding: 28px 16px 56px; min-height: 52vh; }
      .composition  { width: 95%; aspect-ratio: 4/5; }
      .manifesto    { top: 10%; left: 8%; right: 45%; }
      .manifesto span { font-size: clamp(28px, 8.5vw, 40px); }
      .lightning-badge { width: 62px; height: 62px; left: -2%; bottom: 8%; }
      .lightning-badge svg { width: 26px; height: 26px; }
      .form-panel { padding: 40px 20px 32px; }
      .field { height: 58px; padding: 0 22px; gap: 12px; }
      .btn-login { width: 100%; max-width: 240px; height: 54px; }
    }

    .twk-panel { color-scheme: light; }
  </style>
</head>
<body>

  <main class="auth">

    <!-- ─────────────  green visual panel  ───────────── -->
    <section class="visual-panel" aria-hidden="true">

      <div class="orb orb-1"></div>
      <div class="orb orb-2"></div>
      <div class="orb orb-3"></div>

      <!-- decorative wave strokes -->
      <svg class="waves" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid slice">
        <defs>
          <linearGradient id="wave-grad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%"  stop-color="#FFFFFF" stop-opacity="0.18"/>
            <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.02"/>
          </linearGradient>
        </defs>
        <g fill="none" stroke="url(#wave-grad)" stroke-width="2" stroke-linecap="round">
          <path d="M -50 220 C 150 150, 320 340, 520 260 S 820 180, 900 300"/>
          <path d="M -50 340 C 160 270, 340 440, 540 360 S 820 300, 920 400"/>
          <path d="M -50 480 C 180 400, 360 560, 560 480 S 820 440, 940 520"/>
          <path d="M -50 680 C 200 600, 380 760, 580 680 S 820 640, 940 720"/>
          <path d="M -50 820 C 220 740, 400 900, 600 820 S 820 780, 940 860"/>
        </g>
        <g fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="60">
          <path d="M -100 880 Q 400 660, 900 930"/>
          <path d="M -100 1120 Q 400 900, 900 1170"/>
        </g>
        <g fill="#FFFFFF" opacity="0.07">
          <circle cx="180" cy="180" r="6"/>
          <circle cx="640" cy="420" r="4"/>
          <circle cx="380" cy="720" r="5"/>
          <circle cx="700" cy="840" r="7"/>
        </g>
      </svg>

      <!-- composition: glass card + person + badge -->
      <div class="composition">

        <!-- glass card (background frame + manifesto inside) -->
        <div class="glass-card">
          <div class="manifesto">
            <span>Bold.</span>
            <span>Creative.</span>
            <span>Innovative.</span>
          </div>
        </div>

        <!-- hero photo — overlaps the card, bleeds below -->
        <div class="hero-photo">

          <!-- photo: stylized person silhouette holding tablet -->
          <svg class="photo-svg photo-svg-photo" viewBox="0 0 360 600" preserveAspectRatio="xMidYMax meet">
            <defs>
              <linearGradient id="L-hair" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%"  stop-color="#6B3E22"/>
                <stop offset="100%" stop-color="#4A2B17"/>
              </linearGradient>
              <linearGradient id="L-shirt" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%"  stop-color="#BFD7E6"/>
                <stop offset="100%" stop-color="#9DBED2"/>
              </linearGradient>
              <linearGradient id="L-tablet" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%"  stop-color="#E5A88C"/>
                <stop offset="100%" stop-color="#C88B6F"/>
              </linearGradient>
            </defs>
            <!-- hair back -->
            <path d="M 130 95 Q 180 50 230 95 Q 255 160 248 240 Q 250 320 238 380 L 220 400 L 220 250 Q 226 200 212 145 Q 200 115 180 115 Q 160 115 148 145 Q 134 200 140 250 L 140 400 L 122 380 Q 110 320 112 240 Q 105 160 130 95 Z"
                  fill="url(#L-hair)"/>
            <!-- face -->
            <ellipse cx="180" cy="138" rx="44" ry="54" fill="#E6C2A0"/>
            <!-- neck -->
            <path d="M 164 184 L 196 184 L 200 208 L 160 208 Z" fill="#D4A988"/>
            <!-- shirt -->
            <path d="M 124 222 Q 155 208 180 210 Q 205 208 236 222 L 252 392 L 108 392 Z"
                  fill="url(#L-shirt)"/>
            <path d="M 124 226 Q 90 280 104 340 L 142 330 L 142 250 Z" fill="url(#L-shirt)"/>
            <path d="M 236 226 Q 270 280 256 340 L 218 330 L 218 250 Z" fill="url(#L-shirt)"/>
            <ellipse cx="138" cy="338" rx="18" ry="12" fill="#E6C2A0"/>
            <ellipse cx="222" cy="338" rx="18" ry="12" fill="#E6C2A0"/>
            <!-- tablet -->
            <rect x="130" y="296" width="100" height="72" rx="8" fill="url(#L-tablet)"/>
            <rect x="138" y="304" width="84" height="56" rx="4" fill="#F2C6AC" opacity="0.55"/>
            <!-- skirt -->
            <path d="M 108 392 L 252 392 L 276 600 L 84 600 Z" fill="#2A2D32"/>
            <!-- hair front strands -->
            <path d="M 220 92 Q 240 130 232 200 L 224 220 Q 232 150 224 110 Z" fill="#4A2B17" opacity="0.85"/>
            <path d="M 138 92 Q 118 130 128 200 L 136 220 Q 126 150 136 110 Z" fill="#4A2B17" opacity="0.55"/>
          </svg>

          <!-- illustration variant -->
          <svg class="photo-svg photo-svg-illust" viewBox="0 0 360 600" preserveAspectRatio="xMidYMax meet">
            <ellipse cx="180" cy="580" rx="160" ry="18" fill="#FFFFFF" opacity="0.12"/>
            <path d="M 110 260 Q 180 230 250 260 L 280 580 L 80 580 Z" fill="#FFFFFF" opacity="0.85"/>
            <path d="M 120 260 Q 180 235 240 260 L 260 580 L 100 580 Z" fill="#0E7A36"/>
            <circle cx="180" cy="160" r="56" fill="#0F1714"/>
            <path d="M 134 144 Q 180 96 226 144 Q 232 200 210 220 Q 206 180 180 168 Q 154 180 150 220 Q 128 200 134 144 Z" fill="#FFFFFF"/>
            <rect x="136" y="296" width="88" height="64" rx="8" fill="#FFFFFF" stroke="#0E7A36" stroke-width="3"/>
            <rect x="148" y="308" width="64" height="6" rx="3" fill="#0E7A36" opacity="0.9"/>
            <rect x="148" y="320" width="44" height="4" rx="2" fill="#0E7A36" opacity="0.5"/>
            <rect x="148" y="330" width="52" height="4" rx="2" fill="#0E7A36" opacity="0.5"/>
            <rect x="170" y="214" width="20" height="20" fill="#0F1714"/>
          </svg>

          <!-- abstract variant -->
          <svg class="photo-svg photo-svg-abstract" viewBox="0 0 400 600" preserveAspectRatio="xMidYMid meet">
            <defs>
              <linearGradient id="L-blob" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%"  stop-color="#FFFFFF" stop-opacity="0.55"/>
                <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.10"/>
              </linearGradient>
              <linearGradient id="L-blob-2" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%"  stop-color="#0E7A36" stop-opacity="0.65"/>
                <stop offset="100%" stop-color="#0A6B2C" stop-opacity="0.35"/>
              </linearGradient>
            </defs>
            <path d="M 200 60 C 320 60 360 180 340 300 C 320 420 220 500 140 460 C 60 420 40 280 100 180 C 130 110 160 60 200 60 Z"
                  fill="url(#L-blob)"/>
            <path d="M 230 130 C 310 140 320 240 290 320 C 260 400 180 420 140 360 C 100 300 130 200 180 160 C 200 145 220 128 230 130 Z"
                  fill="url(#L-blob-2)"/>
            <circle cx="80"  cy="180" r="8" fill="#FFFFFF" opacity="0.6"/>
            <circle cx="320" cy="240" r="5" fill="#FFFFFF" opacity="0.55"/>
            <circle cx="100" cy="460" r="7" fill="#FFFFFF" opacity="0.5"/>
            <circle cx="320" cy="500" r="10" fill="#FFFFFF" opacity="0.45"/>
          </svg>
        </div>

        <!-- lightning badge -->
        <div class="lightning-badge" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M13 2 L4 14 L11 14 L9 22 L20 9 L13 9 Z"/>
          </svg>
        </div>
      </div>
    </section>


    <!-- ─────────────  form panel  ───────────── -->
    <section class="form-panel">
      <form class="login-form" id="loginForm" novalidate>

        <div class="form-brand">
          <!-- continuous-stroke Z monogram -->
          <svg class="z-mark" viewBox="0 0 64 64" fill="none" aria-label="ZephryxLabs">
            <path d="M 44 14 L 54 14 L 20 52 L 10 52 Z" fill="currentColor"/>
            <rect x="10" y="14" width="44" height="10" fill="currentColor"/>
            <rect x="10" y="42" width="44" height="10" fill="currentColor"/>
          </svg>
        </div>

        <p class="welcome">Welcome Back !</p>

        <label class="field">
          <span class="field-ic" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
          </span>
          <input type="text" name="username" placeholder="Username" autocomplete="username" required />
        </label>

        <label class="field">
          <span class="field-ic" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="4" y="11" width="16" height="10" rx="2"/>
              <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
            </svg>
          </span>
          <input type="password" name="password" placeholder="Password" autocomplete="current-password" required />
          <button type="button" class="eye-toggle" aria-label="Show password">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </label>

        <div class="form-row">
          <label class="check">
            <input type="checkbox" name="remember" />
            <span class="box" aria-hidden="true"></span>
            <span>Remember me</span>
          </label>
          <a class="forgot" href="#forgot">Forgot password?</a>
        </div>

        <button type="submit" class="btn-login">
          <span class="btn-label">Login Now</span>
        </button>

        <p class="form-foot">
          Don't have an account? Contact your <a href="#admin">admin</a>.
        </p>
      </form>
    </section>
  </main>

  <div id="tweaks-root"></div>

  <!-- ─────────────  scripts  ───────────── -->
  <script>
    // password eye toggle
    document.querySelectorAll('.eye-toggle').forEach((btn) => {
      btn.addEventListener('click', () => {
        const input = btn.parentElement.querySelector('input');
        const showing = input.type === 'text';
        input.type = showing ? 'password' : 'text';
        btn.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
      });
    });

    // fake submit
    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const form = e.currentTarget;
      const btn  = form.querySelector('.btn-login');
      const lbl  = btn.querySelector('.btn-label');
      if (btn.classList.contains('loading')) return;

      const missing = [...form.querySelectorAll('input[required]')].find((i) => !i.value);
      if (missing) {
        missing.focus();
        const fld = missing.closest('.field');
        fld.animate(
          [{ transform: 'translateX(0)' }, { transform: 'translateX(-6px)' },
           { transform: 'translateX(6px)' }, { transform: 'translateX(-4px)' },
           { transform: 'translateX(0)' }],
          { duration: 320 }
        );
        return;
      }

      btn.classList.add('loading');
      btn.disabled = true;
      lbl.textContent = 'Signing in';

      setTimeout(() => {
        btn.classList.remove('loading');
        btn.classList.add('success');
        lbl.textContent = '✓  Welcome!';
        setTimeout(() => {
          btn.classList.remove('success');
          btn.disabled = false;
          lbl.textContent = 'Login Now';
        }, 1800);
      }, 1100);
    });
  </script>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel">
    const LOGIN_TWEAKS = /*EDITMODE-BEGIN*/{
      "dark": true,
      "heroStyle": "abstract",
      "showRemember": true,
      "showForgot": true,
      "showFoot": true
    }/*EDITMODE-END*/;

    function applyTweaksToDOM(t) {
      const html = document.documentElement;
      html.setAttribute('data-theme', t.dark ? 'dark' : 'light');
      html.setAttribute('data-hero-style', t.heroStyle);
      html.setAttribute('data-show-remember', String(t.showRemember));
      html.setAttribute('data-show-forgot',   String(t.showForgot));
      html.setAttribute('data-show-foot',     String(t.showFoot));
    }

    function LoginTweaks() {
      const [t, setTweak] = useTweaks(LOGIN_TWEAKS);
      React.useEffect(() => { applyTweaksToDOM(t); }, [t]);
      return (
        <TweaksPanel title="Tweaks">
          <TweakSection label="Theme" />
          <TweakToggle label="Dark mode" value={t.dark}
                       onChange={(v) => setTweak('dark', v)} />

          <TweakSection label="Visual" />
          <TweakRadio label="Image style"
                      value={t.heroStyle}
                      options={[
                        { value: 'photo',        label: 'Photo' },
                        { value: 'illustration', label: 'Illus.' },
                        { value: 'abstract',     label: 'Abstract' },
                      ]}
                      onChange={(v) => setTweak('heroStyle', v)} />

          <TweakSection label="Form options" />
          <TweakToggle label="Remember me" value={t.showRemember}
                       onChange={(v) => setTweak('showRemember', v)} />
          <TweakToggle label="Forgot password" value={t.showForgot}
                       onChange={(v) => setTweak('showForgot', v)} />
          <TweakToggle label="Footer note" value={t.showFoot}
                       onChange={(v) => setTweak('showFoot', v)} />
        </TweaksPanel>
      );
    }

    applyTweaksToDOM(LOGIN_TWEAKS);
    const root = ReactDOM.createRoot(document.getElementById('tweaks-root'));
    root.render(<LoginTweaks />);
  </script>
</body>
</html>
